<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Breathalyzer Dashboard</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/justgage/1.6.1/justgage.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --safe: #10b981;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px; /* Widened slightly to fit the gauges nicely */
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 5px; }

        /* Main Status Card */
        .status-panel {
            background: rgba(15, 23, 42, 0.5);
            border: 2px solid var(--text-muted);
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .status-panel h2 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .metric-card {
            background: rgba(15, 23, 42, 0.5);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .gauge-container {
            width: 100%;
            height: 160px;
        }

        /* Pulse Animation for Danger */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .danger-pulse {
            border-color: var(--danger) !important;
            animation: pulse 1.5s infinite;
        }

        /* Responsive Tweaks */
        @media (max-width: 480px) {
            .status-panel h2 { font-size: 1.5rem; }
            .gauge-container { height: 130px; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <header>
            <h1>Smart Breathalyzer</h1>
            <p>Live Telemetry & Anti-Spoofing Monitor</p>
        </header>

        <div class="status-panel" id="status-panel">
            <h2 id="status">Connecting...</h2>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div id="alco-gauge" class="gauge-container"></div>
            </div>
            <div class="metric-card">
                <div id="hum-gauge" class="gauge-container"></div>
            </div>
            <div class="metric-card">
                <div id="temp-gauge" class="gauge-container"></div>
            </div>
        </div>
    </div>

    <script>
        // --- Initialize Gauges ---
        // Setting up the speedometers before fetching data
        
        const commonGaugeOptions = {
            pointer: true,
            pointerOptions: { toplength: -15, bottomlength: 10, bottomwidth: 12, color: '#8e8e93' },
            gaugeWidthScale: 0.8,
            valueFontColor: "#f8fafc",
            titleFontColor: "#94a3b8",
            labelFontColor: "#94a3b8"
        };

        const alcoGauge = new JustGage({
            id: "alco-gauge",
            value: 0,
            min: 0,
            max: 1000,
            title: "Alcohol (RAW)",
            label: "RAW",
            customSectors: [
                { color: "#10b981", lo: 0, hi: 400 },   // Green for Safe
                { color: "#ef4444", lo: 401, hi: 1000 } // Red for Danger
            ],
            ...commonGaugeOptions
        });

        const humGauge = new JustGage({
            id: "hum-gauge",
            value: 0,
            min: 0,
            max: 100,
            title: "Breath Hum",
            label: "%",
            levelColors: ["#38bdf8"], // Blue
            ...commonGaugeOptions
        });

        const tempGauge = new JustGage({
            id: "temp-gauge",
            value: 0,
            min: 0,
            max: 50,
            title: "Temperature",
            label: "°C",
            levelColors: ["#f59e0b"], // Orange
            ...commonGaugeOptions
        });

        // --- Fetch Data & Update Logic ---
        let previousStatus = "Connecting...";

        setInterval(async () => {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                
                const statusEl = document.getElementById('status');
                const panelEl = document.getElementById('status-panel');

                // Update text status
                statusEl.innerText = data.status;

                // Update Gauges with animated sweeps
                alcoGauge.refresh(data.alcohol);
                humGauge.refresh(Math.round(data.humidity));
                tempGauge.refresh(Math.round(data.temp));

                // --- ALERT LOGIC ---
                if (data.status.includes("DANGER") && previousStatus !== data.status) {
                    alert("🚨 ALARM: Drunk Driver Detected! 🚨\nEngine start sequence disabled.");
                }
                previousStatus = data.status;

                // --- UI COLOR LOGIC ---
                panelEl.classList.remove('danger-pulse'); 
                
                if (data.status.includes("DANGER")) {
                    statusEl.style.color = "var(--danger)";
                    panelEl.style.borderColor = "var(--danger)";
                    panelEl.classList.add('danger-pulse');
                } else if (data.status.includes("Safe")) {
                    statusEl.style.color = "var(--safe)";
                    panelEl.style.borderColor = "var(--safe)";
                } else if (data.status.includes("Warning")) {
                    statusEl.style.color = "var(--warning)";
                    panelEl.style.borderColor = "var(--warning)";
                } else {
                    statusEl.style.color = "var(--text-muted)";
                    panelEl.style.borderColor = "var(--text-muted)";
                }

            } catch (err) {
                console.error("Waiting for ESP32 data...");
            }
        }, 2000);
    </script>
</body>
</html>
