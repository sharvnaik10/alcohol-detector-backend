<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Breathalyzer Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --safe: #10b981;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 5px; }

        /* Main Status Card */
        .status-panel {
            background: rgba(15, 23, 42, 0.5);
            border: 2px solid var(--text-muted);
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .status-panel h2 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
        }

        .metric-card {
            background: rgba(15, 23, 42, 0.5);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .metric-card .label {
            display: block;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .metric-card .value {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--accent);
        }

        .metric-card .unit {
            font-size: 1rem;
            color: var(--text-muted);
            margin-left: 2px;
        }

        /* Pulse Animation for Danger */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .danger-pulse {
            border-color: var(--danger) !important;
            animation: pulse 1.5s infinite;
        }

        /* Responsive Tweaks */
        @media (max-width: 480px) {
            .status-panel h2 { font-size: 1.5rem; }
            .metric-card .value { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <header>
            <h1>Smart Breathalyzer</h1>
            <p>Live Telemetry & Anti-Spoofing Monitor</p>
        </header>

        <div class="status-panel" id="status-panel">
            <h2 id="status">Connecting...</h2>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <span class="label">Alcohol (RAW)</span>
                <span class="value" id="alco">0</span>
            </div>
            <div class="metric-card">
                <span class="label">Breath Hum</span>
                <span class="value" id="hum">0</span><span class="unit">%</span>
            </div>
            <div class="metric-card">
                <span class="label">Temp</span>
                <span class="value" id="temp">0</span><span class="unit">°C</span>
            </div>
        </div>
    </div>

    <script>
        let previousStatus = "Connecting...";

        setInterval(async () => {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                
                const statusEl = document.getElementById('status');
                const panelEl = document.getElementById('status-panel');

                // Update text values
                statusEl.innerText = data.status;
                document.getElementById('alco').innerText = data.alcohol;
                document.getElementById('hum').innerText = Math.round(data.humidity);
                document.getElementById('temp').innerText = Math.round(data.temp);

                // --- ALERT LOGIC ---
                // If status switches to Danger, trigger a browser pop-up alert
                if (data.status.includes("DANGER") && previousStatus !== data.status) {
                    alert("🚨 ALARM: Drunk Driver Detected! 🚨\nEngine start sequence disabled.");
                }
                previousStatus = data.status;

                // --- UI COLOR LOGIC ---
                panelEl.classList.remove('danger-pulse'); // reset pulse
                
                if (data.status.includes("DANGER")) {
                    statusEl.style.color = "var(--danger)";
                    panelEl.style.borderColor = "var(--danger)";
                    panelEl.classList.add('danger-pulse');
                } else if (data.status.includes("Safe")) {
                    statusEl.style.color = "var(--safe)";
                    panelEl.style.borderColor = "var(--safe)";
                } else if (data.status.includes("Warning")) {
                    statusEl.style.color = "var(--warning)";
                    panelEl.style.borderColor = "var(--warning)";
                } else {
                    statusEl.style.color = "var(--text-muted)";
                    panelEl.style.borderColor = "var(--text-muted)";
                }

            } catch (err) {
                console.error("Waiting for ESP32 data...");
            }
        }, 2000);
    </script>
</body>
</html>
