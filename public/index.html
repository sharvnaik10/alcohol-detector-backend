<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Breathalyzer Dashboard</title>
    
    <script src="https://cdn.rawgit.com/Mikhus/canvas-gauges/gh-pages/download/2.1.7/radial/gauge.min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --safe: #10b981;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 900px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 5px; }

        /* Main Status Card */
        .status-panel {
            background: rgba(15, 23, 42, 0.5);
            border: 2px solid var(--text-muted);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .status-panel h2 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        /* Metrics Grid */
        .metrics-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
        }

        .metric-card {
            background: rgba(15, 23, 42, 0.5);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            max-width: 100%;
            height: auto;
        }

        /* Pulse Animation for Danger */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .danger-pulse {
            border-color: var(--danger) !important;
            animation: pulse 1.5s infinite;
        }

        @media (max-width: 480px) {
            .status-panel h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <header>
            <h1>Smart Breathalyzer</h1>
            <p>Live Telemetry & Anti-Spoofing Monitor</p>
        </header>

        <div class="status-panel" id="status-panel">
            <h2 id="status">Connecting...</h2>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <canvas id="alco-gauge"></canvas>
            </div>
            <div class="metric-card">
                <canvas id="hum-gauge"></canvas>
            </div>
            <div class="metric-card">
                <canvas id="temp-gauge"></canvas>
            </div>
        </div>
    </div>

    <script>
        // --- Shared Analog Gauge Styling ---
        const sharedConfig = {
            width: 250,
            height: 250,
            colorPlate: "#1e293b",
            colorMajorTicks: "#f8fafc",
            colorMinorTicks: "#94a3b8",
            colorTitle: "#f8fafc",
            colorUnits: "#94a3b8",
            colorNumbers: "#f8fafc",
            colorNeedle: "rgba(240, 128, 128, 1)",
            colorNeedleEnd: "rgba(255, 160, 122, .9)",
            valueBox: true,
            colorValueText: "#f8fafc",
            colorValueBoxRect: "#0f172a",
            colorValueBoxRectEnd: "#0f172a",
            animationRule: "bounce",
            animationDuration: 500,
            strokeTicks: true,
            borders: false
        };

        // --- 1. Alcohol Gauge (Green to Red) ---
        var alcoGauge = new RadialGauge({
            renderTo: 'alco-gauge',
            title: "Alcohol",
            units: "RAW",
            minValue: 0,
            maxValue: 1000,
            majorTicks: ["0","200","400","600","800","1000"],
            minorTicks: 4,
            highlights: [
                { "from": 0, "to": 400, "color": "rgba(16, 185, 129, 0.5)" },    // Safe Green
                { "from": 400, "to": 600, "color": "rgba(245, 158, 11, 0.5)" },  // Warning Yellow
                { "from": 600, "to": 1000, "color": "rgba(239, 68, 68, 0.5)" }   // Danger Red
            ],
            ...sharedConfig
        }).draw();

        // --- 2. Humidity Gauge (Blue Shades) ---
        var humGauge = new RadialGauge({
            renderTo: 'hum-gauge',
            title: "Breath Hum",
            units: "%",
            minValue: 0,
            maxValue: 100,
            majorTicks: ["0","20","40","60","80","100"],
            minorTicks: 4,
            highlights: [
                { "from": 0, "to": 40, "color": "rgba(148, 163, 184, 0.3)" },    // Grey/Dry
                { "from": 40, "to": 70, "color": "rgba(56, 189, 248, 0.4)" },    // Light Blue
                { "from": 70, "to": 100, "color": "rgba(37, 99, 235, 0.6)" }     // Deep Blue (Breath detected)
            ],
            ...sharedConfig
        }).draw();

        // --- 3. Temperature Gauge (Cool to Hot) ---
        var tempGauge = new RadialGauge({
            renderTo: 'temp-gauge',
            title: "Temp",
            units: "°C",
            minValue: 0,
            maxValue: 50,
            majorTicks: ["0","10","20","30","40","50"],
            minorTicks: 2,
            highlights: [
                { "from": 0, "to": 20, "color": "rgba(56, 189, 248, 0.4)" },     // Cool Blue
                { "from": 20, "to": 35, "color": "rgba(16, 185, 129, 0.4)" },    // Room Temp Green
                { "from": 35, "to": 50, "color": "rgba(239, 68, 68, 0.5)" }      // Hot Red
            ],
            ...sharedConfig
        }).draw();

        // --- Fetch Data & Update Logic ---
        let previousStatus = "Connecting...";

        setInterval(async () => {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                
                const statusEl = document.getElementById('status');
                const panelEl = document.getElementById('status-panel');

                // Update text status
                statusEl.innerText = data.status;

                // Move the physical needles
                alcoGauge.value = data.alcohol;
                humGauge.value = Math.round(data.humidity);
                tempGauge.value = Math.round(data.temp);

                // --- ALERT LOGIC ---
                if (data.status.includes("DANGER") && previousStatus !== data.status) {
                    alert("🚨 ALARM: Drunk Driver Detected! 🚨\nEngine start sequence disabled.");
                }
                previousStatus = data.status;

                // --- UI COLOR LOGIC ---
                panelEl.classList.remove('danger-pulse'); 
                
                if (data.status.includes("DANGER")) {
                    statusEl.style.color = "var(--danger)";
                    panelEl.style.borderColor = "var(--danger)";
                    panelEl.classList.add('danger-pulse');
                } else if (data.status.includes("Safe")) {
                    statusEl.style.color = "var(--safe)";
                    panelEl.style.borderColor = "var(--safe)";
                } else if (data.status.includes("Warning")) {
                    statusEl.style.color = "var(--warning)";
                    panelEl.style.borderColor = "var(--warning)";
                } else {
                    statusEl.style.color = "var(--text-muted)";
                    panelEl.style.borderColor = "var(--text-muted)";
                }

            } catch (err) {
                console.error("Waiting for ESP32 data...");
            }
        }, 2000);
    </script>
</body>
</html>
